<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>알닷 이벤트 운영 관리대장</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* 알닷 디자인 시스템 토큰 (design.md 2026-08-26 기준, OKLCH) */
    --bg: oklch(0.978 0.003 247);       /* grey-50: 캔버스 */
    --panel: oklch(1 0 0);              /* white: 카드 표면 */
    --ink: oklch(0.234 0.030 254);      /* grey-900 */
    --ink-soft: oklch(0.452 0.028 253); /* grey-700 */
    --muted: oklch(0.155 0.060 261 / 0.58); /* text-tertiary (navy-900 @58%) */
    --line: oklch(0.913 0.008 247);     /* grey-200 */
    --grey-100: oklch(0.957 0.005 247);
    --grey-400: oklch(0.752 0.016 251);

    --primary: oklch(0.704 0.180 23);       /* coral-500 (fc6969) */
    --primary-dark: oklch(0.602 0.180 25.9);/* coral-600 pressed */
    --primary-soft: oklch(0.965 0.021 18.9);/* coral-50 */

    --pass: oklch(0.493 0.143 154);         /* green-500 success */
    --pass-text: oklch(0.400 0.120 154);
    --pass-soft: oklch(0.955 0.045 154);
    --minor: oklch(0.748 0.183 56);         /* orange-500 warning */
    --minor-text: oklch(0.480 0.150 56);
    --minor-soft: oklch(0.955 0.050 56);
    --na: oklch(0.652 0.020 252);           /* grey-500 neutral */
    --na-soft: oklch(0.957 0.005 247);
    --major: var(--primary);                /* 연장 = brand 약한 강조 */
    --major-soft: var(--primary-soft);
    --fatal: oklch(0.628 0.218 22);          /* red-500 danger */
    --fatal-text: oklch(0.480 0.190 22);
    --fatal-soft: oklch(0.940 0.040 22);
    --critical: var(--fatal);
    --critical-soft: var(--fatal-soft);
    --hidden-muted: var(--grey-400);        /* 비노출 상태 전용(회색, 위험색과 분리) */

    /* 이벤트 상태 -> 색상 매핑 */
    --done:var(--pass); --done-soft:var(--pass-soft);
    --progress:var(--minor); --progress-soft:var(--minor-soft);
    --waiting:var(--na); --waiting-soft:var(--na-soft);
    --extend:var(--major); --extend-soft:var(--major-soft);
    --overdue:var(--fatal); --overdue-soft:var(--fatal-soft);

    --pass-border: oklch(0.85 0.09 154);
    --minor-border: oklch(0.85 0.10 56);
    --fatal-border: oklch(0.85 0.08 22);

    --shadow-2: 0 4px 12px oklch(0.155 0.060 261 / 0.06), 0 1px 2px oklch(0.155 0.060 261 / 0.04);
    --shadow-3: 0 12px 32px oklch(0.155 0.060 261 / 0.10), 0 2px 6px oklch(0.155 0.060 261 / 0.06);
    --shadow-toast: 0 8px 24px oklch(0.155 0.060 261 / 0.16);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif; padding:26px 18px 70px;}
  .wrap{max-width:1180px; margin:0 auto;}

  .topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .brand .eyebrow{font-size:11px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; font-weight:600;}
  .brand h1{font-weight:700; font-size:24px; margin:2px 0 0;}
  .topbar-actions{display:flex; gap:8px; flex-wrap:wrap;}

  button{font-family:'Pretendard',sans-serif; font-size:13px; font-weight:600; border-radius:12px; border:1px solid var(--line); transition:background .12s var(--ease), border-color .12s var(--ease);
    background:var(--panel); color:var(--ink-soft); padding:8px 14px; cursor:pointer; transition:all .12s ease;}
  button:hover{border-color:var(--primary); color:var(--primary-dark);}
  button.primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  button.primary:hover{background:var(--primary-dark); border-color:var(--primary-dark); color:#fff;}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted); padding:6px 8px;}
  button.ghost:hover{color:var(--primary-dark); border-color:transparent;}
  button.sm{padding:5px 10px; font-size:12px;}
  button:disabled{opacity:.35; cursor:not-allowed;}

  .savebar{
    font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; font-weight:600;
    margin-bottom:14px;
  }
  .savebar .dot{width:7px;height:7px;border-radius:50%; background:var(--pass); flex-shrink:0;}
  .savebar.warn .dot{background:var(--fatal);}
  .savebar.warn{color:var(--primary-dark);}

  .statusboard{background:var(--primary); border-radius:16px; padding:18px 24px; display:flex; flex-wrap:wrap; gap:0; margin-bottom:18px;}
  .sb-item{flex:1; min-width:90px; padding:4px 18px; border-right:1px solid rgba(255,255,255,.22);}
  .sb-item:last-child{border-right:none;}
  .sb-label{font-size:10.5px; letter-spacing:.1em; color:rgba(255,255,255,.75); text-transform:uppercase; margin-bottom:4px; font-weight:600;}
  .sb-value{font-weight:700; font-size:26px; color:#fff; line-height:1;}

  .maintabs{display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--line);}
  .maintab-btn{background:transparent; color:var(--muted); font-weight:600; padding:10px 16px; border:none; border-bottom:2.5px solid transparent; border-radius:12px 12px 0 0;}
  .maintab-btn.active{color:var(--primary-dark); border-bottom-color:var(--primary);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; min-height:220px;}
  .panel h3{font-size:18px; margin:0 0 4px; font-weight:700; letter-spacing:-0.01em;}
  .panel .sub{color:var(--muted); font-size:12.5px; line-height:1.6; margin:0 0 18px;}

  .month-chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:16px; padding-bottom:14px; border-bottom:1px dashed var(--line);}
  .chip{
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:99px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:6px;
    transition:border-color .12s var(--ease), color .12s var(--ease);
  }
  .chip:hover{border-color:var(--primary); color:var(--primary-dark);}
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .chip.active:hover{color:#fff;}
  .chip .del{opacity:.5; font-size:11px; padding:4px; margin:-4px; display:inline-block;}
  .chip .del:hover{opacity:1; color:var(--fatal);}
  .chip-add{border-style:dashed; color:var(--primary-dark); background:transparent;}

  table.edittable{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.edittable th{
    text-align:left; font-size:11px; letter-spacing:.03em; text-transform:uppercase; font-weight:700;
    color:var(--muted); padding:10px 8px; border-bottom:2px solid var(--line); white-space:nowrap;
    position:sticky; top:0; background:var(--panel); z-index:1;
  }
  table.edittable td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.edittable tbody tr:nth-child(even){background:var(--bg);}
  table.edittable tbody tr:hover{background:var(--primary-soft);}
  table.edittable input[type=text], table.edittable input[type=date], table.edittable select{
    width:100%; border:1px solid transparent; background:transparent; font-family:inherit; font-size:12.5px;
    padding:7px 7px; border-radius:6px; color:var(--ink); min-width:70px;
  }
  table.edittable input:hover, table.edittable select:hover{border-color:var(--line); background:var(--panel);}
  table.edittable input:focus, table.edittable select:focus{outline:none; border-color:var(--primary); background:var(--panel);}
  .tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  .tblwrap table.edittable{font-size:12.5px;}
  .status-select.완료{color:var(--pass); font-weight:700;}
  .status-select.진행{color:var(--minor); font-weight:700;}
  .status-select.대기{color:var(--na); font-weight:700;}
  .status-select.연장{color:var(--major); font-weight:700;}
  .status-select.비노출{color:var(--hidden-muted); font-weight:700;}

  .idcell{display:flex; gap:4px; align-items:center;}

  /* 상태 필터 칩 */
  .status-filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}

  /* 일괄 처리 바 */
  .bulk-bar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--primary-soft);
    border:1px solid var(--primary); border-radius:12px; padding:10px 14px; margin-bottom:12px;
  }
  .bulk-bar .bulk-count{font-size:12.5px; font-weight:700; color:var(--primary-dark);}
  .bulk-bar .bulk-actions{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;}
  .row-checkbox, .header-checkbox{width:17px; height:17px; cursor:pointer; accent-color:var(--primary);}

  /* 캘린더 뷰 */
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--muted); font-weight:700; padding-bottom:4px;}
  .cal-cell{
    min-height:64px; border:1px solid var(--line); border-radius:10px; padding:6px; font-size:11.5px;
    background:var(--panel); cursor:pointer; transition:border-color .12s var(--ease);
  }
  .cal-cell.empty{background:transparent; border-color:transparent; cursor:default;}
  .cal-cell:hover:not(.empty){border-color:var(--primary);}
  .cal-cell.today{border-color:var(--primary); border-width:1.5px;}
  .cal-cell .cal-daynum{font-weight:700; color:var(--ink-soft); margin-bottom:3px;}
  .cal-dot-list{display:flex; flex-direction:column; gap:2px;}
  .cal-dot{
    font-size:10px; padding:1px 5px; border-radius:99px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cal-dot.over{background:var(--fatal-soft); color:var(--fatal-text);}
  .cal-dot.soon{background:var(--minor-soft); color:var(--minor-text);}
  .cal-dot.normal{background:var(--na-soft); color:var(--ink-soft);}
  .cal-detail-list{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}

  /* 이력 관리: 데이터 백업·복원 / GitHub / 내보내기 이력 */
  .muted-inline{color:var(--muted); font-size:12px; font-weight:400;}
  .section-toggle{
    cursor:pointer; font-size:14px; font-weight:700; color:var(--ink); list-style:none; padding:10px 0;
    border-top:1px dashed var(--line); margin-top:6px;
  }
  .section-toggle::-webkit-details-marker{display:none;}
  .section-toggle::before{content:'▸ '; color:var(--muted);}
  details[open] > .section-toggle::before{content:'▾ ';}
  .section-toggle-body{padding:14px 0 4px;}
  .section-toggle-sub{
    cursor:pointer; font-size:12.5px; font-weight:600; color:var(--muted); list-style:none; padding:6px 0;
  }
  .section-toggle-sub::-webkit-details-marker{display:none;}
  .section-toggle-sub::before{content:'▸ ';}
  details[open] > .section-toggle-sub::before{content:'▾ ';}
  .gh-step{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .gh-step-num{
    flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .gh-step input{
    flex:1; height:40px; border:1px solid var(--line); border-radius:12px; padding:0 12px; font-size:13px; font-family:inherit;
  }
  .gh-step input:focus{outline:none; border-color:var(--primary); background:var(--primary-soft);}
  .gh-adv-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .gh-adv-row label{width:70px; flex-shrink:0; font-size:12px; color:var(--muted);}
  .gh-adv-row input{flex:1; height:34px; border:1px solid var(--line); border-radius:8px; padding:0 10px; font-size:12.5px; font-family:inherit;}

  /* 프리마케팅 배너 수동 관리 */
  .pm-status-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin:14px 0 18px;}
  .pm-status-item label{display:block; font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:5px; letter-spacing:.02em;}
  .pm-status-item input{width:100%; height:36px; border:1px solid var(--line); border-radius:8px; padding:0 10px; font-size:12.5px; font-family:inherit;}
  .pm-status-item .pm-readonly{
    height:36px; display:flex; align-items:center; padding:0 10px; border-radius:8px; background:var(--bg);
    font-size:12.5px; font-weight:700; color:var(--ink);
  }
  .pm-status-item .pm-readonly.badge-ready{color:var(--minor-text); background:var(--minor-soft);}
  .pm-status-item .pm-readonly.badge-live{color:var(--pass-text); background:var(--pass-soft);}

  .pm-week-grid{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
  .pm-week-col{
    flex:1 0 150px; min-width:150px; border:1px solid var(--line); border-radius:12px; padding:10px;
    background:var(--panel);
  }
  .pm-week-col.current{border-color:var(--primary); background:var(--primary-soft);}
  .pm-week-title{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; text-align:center;}
  .pm-week-col.current .pm-week-title{color:var(--primary-dark);}
  .pm-week-row{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  .pm-week-rank{flex-shrink:0; width:26px; font-size:11px; font-weight:700; color:var(--muted); text-align:right;}
  .pm-week-input{
    flex:1; min-width:0; height:30px; border:1px solid var(--line); border-radius:7px; padding:0 8px;
    font-size:12px; font-family:inherit; background:var(--panel);
  }
  .pm-week-input:focus{outline:none; border-color:var(--primary); background:var(--primary-soft);}

  .tag-badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; flex-shrink:0;}
  .tag-badge.event{background:var(--ink); color:#fff;}
  .tag-badge.banner{background:var(--primary-soft); color:var(--primary-dark);}
  .tag-badge.benefit{background:var(--pass-soft); color:var(--pass-text);}

  .export-item{border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
  .ehi-top{display:flex; align-items:center; gap:10px;}
  .ehi-name{font-size:13.5px; font-weight:700; color:var(--ink); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ehi-actions{display:flex; gap:6px; flex-shrink:0;}
  .ehi-meta{font-size:11.5px; color:var(--muted); margin-top:6px;}
  .ehi-bar{height:4px; background:var(--line); border-radius:99px; margin-top:8px; overflow:hidden;}
  .ehi-bar-fill{height:100%; background:var(--pass); border-radius:99px;}

  .cal-detail-item{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .cal-detail-item:last-child{border-bottom:none;}
  .cal-detail-item .tag{
    flex-shrink:0; font-family:inherit; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px;
  }

  /* 리포트 모달 */
  .report-box{
    white-space:pre-wrap; font-size:12.5px; line-height:1.7; background:var(--bg); border:1px solid var(--line);
    border-radius:12px; padding:16px; max-height:420px; overflow-y:auto; font-family:inherit;
  }

  /* 혜택 만료일 */
  .benefit-expiry-badge{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px; margin-left:6px; white-space:nowrap;}
  .benefit-expiry-badge.over{background:var(--fatal-soft); color:var(--fatal-text);}
  .benefit-expiry-badge.soon{background:var(--minor-soft); color:var(--minor-text);}
  .idcell input{width:56px !important; flex:none;}

  .callout{background:var(--minor-soft); border:1px solid var(--minor-border); color:var(--minor-text); border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; margin-bottom:14px;}
  .callout.ok{background:var(--pass-soft); border-color:var(--pass-border); color:var(--pass-text);}
  .empty-state{text-align:center; padding:48px 16px; color:var(--muted); font-size:13px; line-height:1.6;}
  .empty-state .big{font-size:32px; margin-bottom:10px; opacity:.85;}

  .benefit-block{border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px;}
  .benefit-block .bb-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; cursor:pointer;}
  .benefit-block .bb-head:hover .bb-title{color:var(--primary-dark);}
  .accordion-chevron{display:inline-block; width:12px; color:var(--muted);}
  .benefit-block .bb-title{font-weight:700; font-size:14.5px;}
  .benefit-row{display:grid; grid-template-columns:1.6fr 2.4fr 0.9fr 1fr 28px; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); align-items:center;}
  .benefit-row:last-child{border-bottom:none;}
  .benefit-row input{border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:12.5px; font-family:inherit;}
  .benefit-row input:focus{outline:none; border-color:var(--primary);}

  .banner-columns-editor{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}

  .col-chip{font-size:11.5px; font-weight:600; background:var(--primary-soft); color:var(--primary-dark); padding:5px 10px; border-radius:99px; display:flex; align-items:center; gap:5px;}
  .col-chip .del{cursor:pointer; opacity:.6;}
  .col-chip .del:hover{opacity:1; color:var(--fatal);}

  .modal-overlay{position:fixed; inset:0; background:rgba(43,37,35,.4); display:flex; align-items:center; justify-content:center; z-index:50;}
  #confirmModalOverlay, #promptModalOverlay{z-index:60;}
  .modal{background:#fff; border-radius:20px; padding:24px; width:360px; max-width:90vw; box-shadow:var(--shadow-3);}
  .modal h4{margin:0 0 12px; font-size:16px; font-weight:700;}
  .modal input{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:12px; font-size:13px; margin-bottom:14px; font-family:inherit;}
  .modal .actions{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
  .modal .review-list{max-height:280px; overflow-y:auto; font-size:12.5px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px;}
  .modal .review-list div{padding:3px 0;}

  footer{text-align:center; color:var(--muted); font-size:11px; margin-top:30px;}
  .hidden{display:none !important;}
  input[type=file]{display:none;}

  /* 인라인 에러 배너 (alert 대체) */
  .inline-error{
    background:var(--fatal-soft); border:1px solid var(--fatal-border); color:var(--fatal-text); border-radius:12px;
    padding:11px 14px; font-size:12.5px; margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .inline-error .close{margin-left:auto; cursor:pointer; opacity:.6;}
  .inline-error .close:hover{opacity:1;}

  /* 토스트 (완료 알림 - alert 대체) */
  #toastStack{position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:100;}
  .toast{
    background:var(--ink); color:#fff; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:600; box-shadow:var(--shadow-toast);
    box-shadow:0 8px 24px rgba(43,37,35,.18); max-width:320px; line-height:1.5;
    animation:toast-in .18s ease;
  }
  .toast.success{background:var(--pass);}
  .toast.error{background:var(--critical);}
  @keyframes toast-in{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* 버튼 로딩 상태 */
  .spinner{
    display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,.5); border-top-color:#fff;
    border-radius:50%; animation:spin .6s linear infinite; margin-right:6px; vertical-align:-2px;
  }
  button:not(.primary) .spinner{border-color:rgba(43,37,35,.25); border-top-color:var(--ink-soft);}
  @keyframes spin{ to{transform:rotate(360deg);} }

  /* 포커스 표시는 임의로 제거하지 않음 */
  a:focus-visible, button:focus-visible, .chip:focus-visible{ outline:2px solid var(--primary-dark); outline-offset:2px; }

  /* 하이라이트 플래시 (마감 알림 이동 후 강조) */
  @keyframes flash-pulse{
    0%{background:var(--primary-soft);} 60%{background:var(--primary-soft);} 100%{background:transparent;}
  }
  .flash-highlight{ animation:flash-pulse 1.6s ease; }
  tr.flash-highlight td{ animation:flash-pulse 1.6s ease; }

  /* 홈 대시보드 */

</style>
</head>

<script>
/* ════════════════════════════════════════════════════════════
   상태 & 저장
   ════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'alddot_history';
let STATE = null;
let STORAGE_OK = true;
let saveTimer = null;

function showToast(msg, type='success'){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3600);
}
function showError(msg){
  document.getElementById('globalErrorText').textContent = msg;
  document.getElementById('globalError').classList.remove('hidden');
}
function clearError(){ document.getElementById('globalError').classList.add('hidden'); }

function showPromptModal(title, defaultValue, onSubmit){
  const overlay = document.getElementById('promptModalOverlay');
  const input = document.getElementById('promptModalInput');
  const okBtn = document.getElementById('promptModalOkBtn');
  const cancelBtn = document.getElementById('promptModalCancelBtn');
  document.getElementById('promptModalTitle').textContent = title;
  input.value = defaultValue || '';
  overlay.classList.remove('hidden');
  setTimeout(()=> input.focus(), 30);

  function cleanup(){
    overlay.classList.add('hidden');
    okBtn.removeEventListener('click', handleOk);
    cancelBtn.removeEventListener('click', handleCancel);
    input.removeEventListener('keydown', handleKeydown);
    overlay.removeEventListener('click', handleOverlayClick);
  }
  function handleOk(){ const v = input.value.trim(); cleanup(); if(v) onSubmit(v); }
  function handleCancel(){ cleanup(); }
  function handleKeydown(e){ if(e.key==='Enter') handleOk(); else if(e.key==='Escape') handleCancel(); }
  function handleOverlayClick(e){ if(e.target===overlay) handleCancel(); }
  okBtn.addEventListener('click', handleOk);
  cancelBtn.addEventListener('click', handleCancel);
  input.addEventListener('keydown', handleKeydown);
  overlay.addEventListener('click', handleOverlayClick);
}

function showConfirmModal(message, onConfirm, onCancel){
  const overlay = document.getElementById('confirmModalOverlay');
  const okBtn = document.getElementById('confirmModalOkBtn');
  const cancelBtn = document.getElementById('confirmModalCancelBtn');
  document.getElementById('confirmModalMessage').textContent = message;
  overlay.classList.remove('hidden');
  setTimeout(()=> okBtn.focus(), 30);

  function cleanup(){
    overlay.classList.add('hidden');
    okBtn.removeEventListener('click', handleOk);
    cancelBtn.removeEventListener('click', handleCancel);
    document.removeEventListener('keydown', handleKeydown);
    overlay.removeEventListener('click', handleOverlayClick);
  }
  function handleOk(){ cleanup(); onConfirm(); }
  function handleCancel(){ cleanup(); if(onCancel) onCancel(); }
  function handleKeydown(e){ if(e.key==='Escape') handleCancel(); }
  function handleOverlayClick(e){ if(e.target===overlay) handleCancel(); }
  okBtn.addEventListener('click', handleOk);
  cancelBtn.addEventListener('click', handleCancel);
  document.addEventListener('keydown', handleKeydown);
  overlay.addEventListener('click', handleOverlayClick);
}
function setBtnLoading(btn, text){
  btn.dataset.originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span>${text}`;
}
function resetBtn(btn){
  btn.disabled = false;
  if(btn.dataset.originalLabel) btn.innerHTML = btn.dataset.originalLabel;
}

const EVENT_FIELDS = ["priority","status","name","workType","category","dueDate","reflectStatus","source","reviewUrl","urlType","opUrl","note"];
const EVENT_FIELD_LABELS = {
  priority:"우선순위", status:"작업상태", name:"이벤트명", workType:"작업유형", category:"구분",
  dueDate:"반영예정일", reflectStatus:"반영상태", source:"소스수급", reviewUrl:"검수용URL",
  urlType:"URL유형", opUrl:"운영URL", note:"주요특이사항"
};
const STATUS_OPTIONS = ["완료","진행","대기","연장","비노출"];
const PRIORITY_OPTIONS = ["상","중","하"];
const DONE_STATUSES = new Set(["완료","연장","비노출"]);
const CARRY_STATUSES = new Set(["연장"]);
const DEFAULT_BANNER_COLUMNS = ["메인 팝업","메인 상단","메인 하단","이벤트/썸네일"];

function defaultState(){
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth()+1;
  const key = `${y}-${String(m).padStart(2,'0')}`;
  const label = `${String(y%100).padStart(2,'0')}년 ${m}월`;
  return {
    eventMonths: [ {key, label, events: []} ],
    bannerMonths: [ {key, label, columns: DEFAULT_BANNER_COLUMNS.slice(), ranks: [], partners: [], preMarketingPartners: [], cycleWeeks: 4, weekAnchor: defaultWeekAnchor(key), changeLog: []} ],
    benefitBlocks: [ {label, items: [], _blockUid: uid()} ],
    eventRequests: [],
    activityLog: [],
  };
}
function ensureStateShape(){
  if(!STATE.eventRequests) STATE.eventRequests = [];
  if(!STATE.activityLog) STATE.activityLog = [];
  if(!STATE.exportHistory) STATE.exportHistory = [];
  if(!STATE.eventMonths) STATE.eventMonths = defaultState().eventMonths;
  if(!STATE.bannerMonths) STATE.bannerMonths = defaultState().bannerMonths;
  if(!STATE.benefitBlocks) STATE.benefitBlocks = defaultState().benefitBlocks;
  STATE.bannerMonths.forEach(mo=>{
    if(!mo.partners) mo.partners = [];
    if(!mo.preMarketingPartners) mo.preMarketingPartners = [];
    if(!mo.cycleWeeks) mo.cycleWeeks = 4;
    mo.preMarketingPartners.forEach(p=>{ if(!p._uid) p._uid = uid(); });
    if(!mo.weekAnchor) mo.weekAnchor = defaultWeekAnchor(mo.key);
    if(!mo.changeLog) mo.changeLog = [];
  });
  STATE.benefitBlocks.forEach(b=>{
    if(!b._blockUid) b._blockUid = uid();
    b.items.forEach(it=>{ if(!it._uid) it._uid = uid(); });
  });
}

function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

async function loadState(){
  try{
    if(hasClaudeStorage()){
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value){ STATE = JSON.parse(res.value); ensureStateShape(); return; }
    }else{
      // Claude 아티팩트 환경이 아닌 곳(GitHub Pages 등 직접 호스팅)에서는 브라우저 localStorage를 사용한다.
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ STATE = JSON.parse(raw); ensureStateShape(); return; }
    }
  }catch(err){ STORAGE_OK = false; }
  STATE = defaultState();
}
function scheduleSave(){
  renderSavebar('저장 중…', false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 400);
}
async function doSave(){
  try{
    if(hasClaudeStorage()){
      await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
    }else{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    }
    STORAGE_OK = true;
    renderSavebar('자동 저장됨', false);
  }catch(err){
    STORAGE_OK = false;
    renderSavebar('자동 저장 불가 — 이력 관리 탭의 "백업 파일 다운로드"로 꼭 내려받아 두세요', true);
  }
}
function renderSavebar(text, warn){
  document.getElementById('savebarText').textContent = text;
  document.getElementById('savebar').classList.toggle('warn', !!warn);
}

/* ════════════════════════════════════════════════════════════
   공통 유틸
   ════════════════════════════════════════════════════════════ */
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nextMonthOf(key){
  const [y,m] = key.split('-').map(Number);
  let ny=y, nm=m+1; if(nm>12){nm=1; ny+=1;}
  return { key:`${ny}-${String(nm).padStart(2,'0')}`, label:`${String(ny%100).padStart(2,'0')}년 ${nm}월` };
}
function isoToDot(iso){ return iso ? iso.replaceAll('-','.') : ''; }
function dotToIso(s){
  if(!s) return '';
  const m = String(s).trim().match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})\.?$/);
  if(!m) return '';
  return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}
function parseDueDate(s){
  const iso = dotToIso(s);
  if(!iso) return null;
  const [y,mo,d] = iso.split('-').map(Number);
  return new Date(y, mo-1, d);
}
function daysBetween(a,b){
  const A = new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const B = new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((A-B)/86400000);
}
function scanDeadlines(events, dueSoonDays=7){
  const today = new Date();
  const overdue=[], dueSoon=[];
  events.forEach(ev=>{
    if(!ev.name) return;
    if(DONE_STATUSES.has(ev.status)) return;
    const due = parseDueDate(ev.dueDate);
    if(!due) return;
    const d = daysBetween(due, today);
    if(d<0) overdue.push({...ev, d});
    else if(d<=dueSoonDays) dueSoon.push({...ev, d});
  });
  overdue.sort((a,b)=>a.d-b.d);
  dueSoon.sort((a,b)=>a.d-b.d);
  return {overdue, dueSoon};
}
function maxEventId(){
  let max = 0;
  STATE.eventMonths.forEach(mo => mo.events.forEach(ev=>{
    const s = String(ev.id||'').trim();
    if(/^\d+$/.test(s)) max = Math.max(max, parseInt(s));
  }));
  return max;
}
function defaultWeekAnchor(key){
  // 매주 목요일 오전 10시 마감 기준: 해당 월 1일 이후 첫 번째 목요일을 기본값으로 잡는다.
  // (실제 1주차 시작일은 운영 상황에 따라 달라질 수 있어, 아래 '기준일' 입력에서 직접 조정 가능)
  const [y, m] = key.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const dow = first.getDay(); // 0=일 ... 4=목
  const offset = (4 - dow + 7) % 7;
  const day = 1 + offset;
  const pad = n=>String(n).padStart(2,'0');
  return `${y}-${pad(m)}-${pad(day)}T10:00`;
}

function uid(){ return Math.random().toString(36).slice(2,9); }

function extractEventIdFromUrl(url){
  if(!url) return '';
  const matches = String(url).match(/\d+/g);
  if(!matches || !matches.length) return '';
  const lastNum = matches[matches.length-1];
  return lastNum.slice(-4);
}

function nextCalendarMonthKey(){
  const now = new Date();
  let ny = now.getFullYear(), nm = now.getMonth() + 2; // 다음달 (0-indexed 보정 +1, 다음달 +1)
  if(nm > 12){ nm -= 12; ny += 1; }
  return `${ny}-${String(nm).padStart(2,'0')}`;
}
function getDefaultActiveEventMonthKey(){
  const nextKey = nextCalendarMonthKey();
  if(STATE.eventMonths.some(m=>m.key===nextKey)) return nextKey;
  return STATE.eventMonths[STATE.eventMonths.length-1].key;
}
function getDefaultActiveBannerMonthKey(){
  if(!STATE.bannerMonths.length) return null;
  const nextKey = nextCalendarMonthKey();
  if(STATE.bannerMonths.some(m=>m.key===nextKey)) return nextKey;
  return STATE.bannerMonths[STATE.bannerMonths.length-1].key;
}

function logActivity(icon, action, detail, tab, monthKey){
  if(!STATE.activityLog) STATE.activityLog = [];
  STATE.activityLog.unshift({ id: uid(), at: new Date().toISOString(), icon, action, detail: detail||'', tab: tab||null, monthKey: monthKey||null });
  if(STATE.activityLog.length > 200) STATE.activityLog.length = 200;
}

function renderMonthChipsHtml(months, activeKey, showAll){
  let html = '';
  if(!showAll && months.length > RECENT_MONTHS_VISIBLE){
    html += `<span class="chip chip-more" data-action="show-all">⋯ 이전 달 더보기 (${months.length - RECENT_MONTHS_VISIBLE}개월)</span>`;
  }
  const list = showAll ? months : months.slice(-RECENT_MONTHS_VISIBLE);
  html += list.map(mo => `
    <span class="chip ${mo.key===activeKey?'active':''}" data-key="${mo.key}">
      ${escapeHtml(mo.label)}
      ${months.length>1?`<span class="del" data-delkey="${mo.key}" title="이 달 삭제">🗑️</span>`:''}
    </span>`).join('');
  if(showAll && months.length > RECENT_MONTHS_VISIBLE){
    html += `<span class="chip chip-more" data-action="collapse">▲ 접기</span>`;
  }
  return html;
}

/* ════════════════════════════════════════════════════════════
   활성 탭/월 상태
   ════════════════════════════════════════════════════════════ */
let activeMainTab = 'home';
let activeEventMonthKey = null;
let activeBannerMonthKey = null;
let activeBenefitIndex = 0;
let showAllEventMonths = false;
let showAllBannerMonths = false;
const RECENT_MONTHS_VISIBLE = 6;
let activeEventStatusFilter = '전체';
let selectedEventUids = new Set();

function getEventMonth(key){ return STATE.eventMonths.find(m=>m.key===key); }
function getBannerMonth(key){ return STATE.bannerMonths.find(m=>m.key===key); }

/* ════════════════════════════════════════════════════════════
   렌더: 상단 상태판 (선택된 이벤트 월 기준)
   ════════════════════════════════════════════════════════════ */
function renderStatusboard(){
  const mo = getEventMonth(activeEventMonthKey);
  const board = document.getElementById('statusboardHolder');
  if(!mo || !board) return;
  let total=0, done=0, prog=0, wait=0, ext=0;
  mo.events.forEach(ev=>{
    total++;
    if(ev.status==='완료') done++;
    else if(ev.status==='진행') prog++;
    else if(ev.status==='대기') wait++;
    else if(ev.status==='연장') ext++;
  });
  board.innerHTML = `
    <div class="sb-item"><div class="sb-label">${escapeHtml(mo.label)}</div><div class="sb-value" style="font-size:16px;">이벤트 현황</div></div>
    <div class="sb-item"><div class="sb-label">이벤트 수</div><div class="sb-value">${total}</div></div>
    <div class="sb-item"><div class="sb-label">완료</div><div class="sb-value">${done}</div></div>
    <div class="sb-item"><div class="sb-label">진행</div><div class="sb-value">${prog}</div></div>
    <div class="sb-item"><div class="sb-label">대기</div><div class="sb-value">${wait}</div></div>
    <div class="sb-item"><div class="sb-label">연장</div><div class="sb-value">${ext}</div></div>
    <div class="sb-item"><div class="sb-label">다음 ID</div><div class="sb-value">${maxEventId()+1}</div></div>
  `;
}

let deadlineBoxExpanded = false;

function renderDeadlineBox(){
  const mo = getEventMonth(activeEventMonthKey);
  const holder = document.getElementById('deadlineBoxHolder');
  if(!mo || !holder) return;
  const {overdue, dueSoon} = scanDeadlines(mo.events);
  if(!overdue.length && !dueSoon.length){ holder.innerHTML=''; return; }

  const all = [...overdue, ...dueSoon];
  const boxClass = overdue.length ? 'has-overdue' : 'only-soon';
  const PREVIEW_COUNT = 3;
  const visibleItems = deadlineBoxExpanded ? all : all.slice(0, PREVIEW_COUNT);
  const hiddenCount = all.length - visibleItems.length;

  const rowHtml = (ev)=>{
    const isOver = ev.d < 0;
    const tag = isOver ? `D+${Math.abs(ev.d)}` : (ev.d===0?'오늘':'D-'+ev.d);
    return `<div class="deadline-row" data-uid="${ev._uid}">
      <span class="dtag ${isOver?'over':'soon'}">${tag}</span>
      <span class="dl-name">${escapeHtml(ev.name||'(제목없음)')}</span>
    </div>`;
  };

  holder.innerHTML = `
    <div class="deadline-box ${boxClass}">
      <div class="db-title">
        <span>⏰ 마감 알림 · ${escapeHtml(mo.label)}</span>
        ${overdue.length ? `<span class="db-pill over">지연 ${overdue.length}</span>` : ''}
        ${dueSoon.length ? `<span class="db-pill soon">임박 ${dueSoon.length}</span>` : ''}
      </div>
      <div class="deadline-rows">${visibleItems.map(rowHtml).join('')}</div>
      ${all.length > PREVIEW_COUNT ? `<button class="deadline-toggle-btn">${deadlineBoxExpanded ? '접기' : `+${hiddenCount}건 더 보기`}</button>` : ''}
    </div>`;

  holder.querySelectorAll('.deadline-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const uidVal = row.dataset.uid;
      flashHighlight(document.querySelector(`#eventsTbody tr[data-uid="${uidVal}"]`));
    });
  });

  const toggleBtn = holder.querySelector('.deadline-toggle-btn');
  if(toggleBtn) toggleBtn.addEventListener('click', ()=>{ deadlineBoxExpanded = !deadlineBoxExpanded; renderDeadlineBox(); });
}

/* ════════════════════════════════════════════════════════════

      <div id="deadlineBoxHolder"></div>

            <th>우선순위</th><th>상태</th><th style="min-width:160px;">이벤트명</th><th>작업유형</th><th>구분</th>
            <th>반영예정일</th><th>반영상태</th><th>소스수급</th><th style="min-width:140px;">검수URL</th>

    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const delKey = el.dataset.delkey;
      const delLabel = el.parentElement.textContent.trim();
      showConfirmModal(`'${delLabel}' 데이터를 삭제할까요?`, ()=>{
        STATE.eventMonths = STATE.eventMonths.filter(m=>m.key!==delKey);
        if(activeEventMonthKey===delKey) activeEventMonthKey = getDefaultActiveEventMonthKey();
        scheduleSave(); renderEventsTab();
      });
    });
  });
  const showAllChip = container.querySelector('.chip[data-action="show-all"]');
  if(showAllChip) showAllChip.addEventListener('click', ()=>{ showAllEventMonths = true; renderEventsTab(); });
  const collapseChip = container.querySelector('.chip[data-action="collapse"]');
  if(collapseChip) collapseChip.addEventListener('click', ()=>{ showAllEventMonths = false; renderEventsTab(); });

  document.getElementById('addEventMonthChip').addEventListener('click', addNewEventMonth);
  document.getElementById('addEventRowBtn').addEventListener('click', ()=>{

    mo.events.push({_uid:uid(), priority:"중", status:"대기", name:"", workType:"", category:"", dueDate:"", reflectStatus:"", source:"", reviewUrl:"", urlType:"", opUrl:"", note:"", id:""});
    scheduleSave(); renderEventsRows(); renderStatusboard(); renderDeadlineBox();

function renderEventStatusFilterRow(){
  const mo = getEventMonth(activeEventMonthKey);
  const holder = document.getElementById('eventStatusFilterRow');
  const filters = ['전체', ...STATUS_OPTIONS];
  holder.innerHTML = filters.map(f=>{
    const count = f==='전체' ? mo.events.length : mo.events.filter(ev=>ev.status===f).length;
    return `<span class="chip ${activeEventStatusFilter===f?'active':''}" data-filter="${f}">${f} (${count})</span>`;
  }).join('');
  holder.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeEventStatusFilter = chip.dataset.filter;
      selectedEventUids = new Set();
      renderEventStatusFilterRow();
      renderEventsRows();
    });
  });
}

function renderEventsRows(){
  const mo = getEventMonth(activeEventMonthKey);
  const tbody = document.getElementById('eventsTbody');
  const visibleIndices = mo.events
    .map((ev,i)=>i)
    .filter(i => activeEventStatusFilter==='전체' || mo.events[i].status===activeEventStatusFilter);

  if(!mo.events.length){
    tbody.innerHTML = `<tr><td colspan="15"><div class="empty-state"><div class="big">🗒️</div>아직 등록된 이벤트가 없어요. 위 “이벤트 행 추가하기”를 눌러 시작하세요.</div></td></tr>`;
    renderBulkBar(); return;
  }
  if(!visibleIndices.length){
    tbody.innerHTML = `<tr><td colspan="15"><div class="empty-state"><div class="big">🔎</div>'${activeEventStatusFilter}' 상태의 이벤트가 없어요.</div></td></tr>`;
    renderBulkBar(); return;
  }

  tbody.innerHTML = visibleIndices.map(idx=>{
    const ev = mo.events[idx];
    const priOpts = PRIORITY_OPTIONS.map(o=>`<option value="${o}" ${ev.priority===o?'selected':''}>${o}</option>`).join('');
    const statOpts = STATUS_OPTIONS.map(o=>`<option value="${o}" ${ev.status===o?'selected':''}>${o}</option>`).join('');
    const checked = selectedEventUids.has(ev._uid) ? 'checked' : '';
    return `<tr data-idx="${idx}" data-uid="${ev._uid||''}">
      <td><input type="checkbox" class="row-checkbox" ${checked}/></td>
      <td><select class="ev-field" data-field="priority">${priOpts}</select></td>
      <td><select class="ev-field status-select ${ev.status}" data-field="status">${statOpts}</select></td>
      <td><input type="text" class="ev-field" data-field="name" value="${escapeHtml(ev.name)}" placeholder="이벤트명"/></td>
      <td><input type="text" class="ev-field" data-field="workType" value="${escapeHtml(ev.workType)}" placeholder="HTML 등"/></td>
      <td><input type="text" class="ev-field" data-field="category" value="${escapeHtml(ev.category)}" placeholder="파트너사 등"/></td>
      <td><input type="text" class="ev-field" data-field="dueDate" value="${escapeHtml(ev.dueDate)}"/></td>
      <td><input type="text" class="ev-field" data-field="reflectStatus" value="${escapeHtml(ev.reflectStatus)}"/></td>
      <td><input type="text" class="ev-field" data-field="source" value="${escapeHtml(ev.source)}"/></td>
      <td><input type="text" class="ev-field" data-field="reviewUrl" value="${escapeHtml(ev.reviewUrl)}"/></td>
      <td><input type="text" class="ev-field" data-field="urlType" value="${escapeHtml(ev.urlType)}" placeholder="신규"/></td>
      <td><input type="text" class="ev-field" data-field="opUrl" value="${escapeHtml(ev.opUrl)}"/></td>
      <td><div class="idcell"><input type="text" class="ev-field" data-field="id" value="${escapeHtml(ev.id)}"/>
        <button class="ghost sm assign-id-btn" title="다음 번호 채번">🔢</button></div></td>
      <td><input type="text" class="ev-field" data-field="note" value="${escapeHtml(ev.note)}"/></td>
      <td style="white-space:nowrap;">
        <button class="row-link-btn duplicate-row-btn" title="다음 달로 복제">🔁</button>
        <button class="ghost del-row-btn" title="행 삭제">🗑️</button>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr').forEach(tr=>{
    const idx = +tr.dataset.idx;
    tr.querySelectorAll('.ev-field').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        mo.events[idx][inp.dataset.field] = inp.value;
        if(inp.dataset.field==='status'){
          inp.className = 'ev-field status-select ' + inp.value;
          renderStatusboard(); renderDeadlineBox(); renderEventStatusFilterRow();
        }
        if(inp.dataset.field==='opUrl'){
          const extracted = extractEventIdFromUrl(inp.value);
          if(extracted && !mo.events[idx].id){
            mo.events[idx].id = extracted;
            const idInput = tr.querySelector('.ev-field[data-field="id"]');
            if(idInput) idInput.value = extracted;
            renderStatusboard();
          }
        }
        scheduleSave();
      });
    });
    tr.querySelector('.assign-id-btn').addEventListener('click', ()=>{
      mo.events[idx].id = String(maxEventId()+1);
      scheduleSave(); renderEventsRows(); renderStatusboard(); renderDeadlineBox();
    });
    tr.querySelector('.del-row-btn').addEventListener('click', ()=>{
      showConfirmModal('이 행을 삭제할까요?', ()=>{
        selectedEventUids.delete(mo.events[idx]._uid);
        mo.events.splice(idx,1); scheduleSave(); renderEventsRows(); renderStatusboard(); renderDeadlineBox(); renderEventStatusFilterRow();
      });
    });
    tr.querySelector('.duplicate-row-btn').addEventListener('click', ()=> duplicateEventToNextMonth(mo.events[idx]));
    tr.querySelector('.row-checkbox').addEventListener('change', (e)=>{
      const eventUid = mo.events[idx]._uid;
      if(e.target.checked) selectedEventUids.add(eventUid); else selectedEventUids.delete(eventUid);
      renderBulkBar();
    });
  });

  const headerCb = document.getElementById('eventsHeaderCheckbox');
  if(headerCb){
    headerCb.checked = visibleIndices.length>0 && visibleIndices.every(i=>selectedEventUids.has(mo.events[i]._uid));
    headerCb.onchange = ()=>{
      if(headerCb.checked) visibleIndices.forEach(i=> selectedEventUids.add(mo.events[i]._uid));
      else visibleIndices.forEach(i=> selectedEventUids.delete(mo.events[i]._uid));
      renderEventsRows();
    };
  }
  renderBulkBar();
}

function renderBulkBar(){
  const holder = document.getElementById('bulkBarHolder');
  if(!holder) return;
  if(!selectedEventUids.size){ holder.innerHTML=''; return; }
  const statusBtns = STATUS_OPTIONS.map(s=>`<button class="sm bulk-status-btn" data-status="${s}">${s}로 변경</button>`).join('');
  holder.innerHTML = `
    <div class="bulk-bar">
      <span class="bulk-count">${selectedEventUids.size}건 선택됨</span>
      <div class="bulk-actions">
        ${statusBtns}
        <button class="sm bulk-delete-btn" style="color:var(--fatal);">🗑️ 선택 삭제</button>
      </div>
    </div>
  `;
  holder.querySelectorAll('.bulk-status-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mo = getEventMonth(activeEventMonthKey);
      const count = selectedEventUids.size;
      mo.events.forEach(ev=>{ if(selectedEventUids.has(ev._uid)) ev.status = btn.dataset.status; });
      logActivity('☑️', `이벤트 ${count}건 상태를 '${btn.dataset.status}'로 일괄 변경`, mo.label, 'events', mo.key);
      scheduleSave(); renderEventsRows(); renderStatusboard(); renderDeadlineBox(); renderEventStatusFilterRow();
      showToast(`${count}건을 '${btn.dataset.status}' 상태로 바꿨어요.`);
    });
  });
  holder.querySelector('.bulk-delete-btn').addEventListener('click', ()=>{
    const count = selectedEventUids.size;
    showConfirmModal(`선택한 ${count}건을 삭제할까요?`, ()=>{
      const mo = getEventMonth(activeEventMonthKey);
      mo.events = mo.events.filter(ev=> !selectedEventUids.has(ev._uid));
      selectedEventUids = new Set();
      logActivity('🗑️', `이벤트 ${count}건 일괄 삭제`, mo.label, 'events', mo.key);
      scheduleSave(); renderEventsRows(); renderStatusboard(); renderDeadlineBox(); renderEventStatusFilterRow();
    });
  });
}

function duplicateEventToNextMonth(sourceEvent){
  const {key: nextKey, label: nextLabel} = nextMonthOf(activeEventMonthKey);
  let targetMonth = getEventMonth(nextKey);
  const proceed = ()=>{
    targetMonth.events.push({
      ...sourceEvent, _uid: uid(), status:'대기', id:'',
    });
    logActivity('🔁', `'${sourceEvent.name||'이벤트'}' 이벤트를 '${nextLabel}'로 복제`, '', 'events', nextKey);
    scheduleSave();
    if(activeEventMonthKey===nextKey) renderEventsRows();
    showToast(`'${sourceEvent.name||'이벤트'}'를 '${nextLabel}'에 복제했어요.`);
  };
  if(!targetMonth){
    showConfirmModal(`'${nextLabel}' 시트가 아직 없어요. 새로 만들면서 복제할까요?`, ()=>{
      STATE.eventMonths.push({key:nextKey, label:nextLabel, events:[]});
      STATE.eventMonths.sort((a,b)=> a.key<b.key?-1:1);
      targetMonth = getEventMonth(nextKey);
      proceed();
    });
  }else{
    proceed();
  }
}

function statusColorVar(status){
  if(status==='완료') return 'var(--pass)';
  if(status==='진행') return 'var(--minor)';
  if(status==='연장') return 'var(--major)';
  if(status==='비노출') return 'var(--hidden-muted)';
  return 'var(--na)';
}
function statusSoftVar(status){
  if(status==='완료') return 'var(--pass-soft)';
  if(status==='진행') return 'var(--minor-soft)';
  if(status==='연장') return 'var(--major-soft)';
  if(status==='비노출') return 'var(--na-soft)';
  return 'var(--na-soft)';
}

/* ════════════════════════════════════════════════════════════
   캘린더 보기 (반영예정일 기준)
   ════════════════════════════════════════════════════════════ */
function openCalendarModal(){
  const mo = getEventMonth(activeEventMonthKey);
  const [y, m] = mo.key.split('-').map(Number);
  document.getElementById('calendarModalTitle').textContent = `📅 ${mo.label} 캘린더`;
  const body = document.getElementById('calendarModalBody');

  // 어느 '월별 탭'에 있든, 반영예정일이 이 달력 월에 속하면 모두 모은다.
  // 완료/연장/비노출처럼 작업이 종료된 이벤트는 마감 알림 대상에서 제외한다.
  const byDay = {};
  STATE.eventMonths.forEach(monthObj=>{
    monthObj.events.forEach(ev=>{
      if(DONE_STATUSES.has(ev.status)) return;
      const d = parseDueDate(ev.dueDate);
      if(!d || d.getFullYear()!==y || d.getMonth()+1!==m) return;
      const day = d.getDate();
      (byDay[day] = byDay[day]||[]).push(ev);
    });
  });

  const firstDow = new Date(y, m-1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const today = new Date();
  const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const isThisMonth = today.getFullYear()===y && (today.getMonth()+1)===m;

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const evs = byDay[day]||[];
    const isToday = isThisMonth && today.getDate()===day;
    const shown = evs.slice(0,3).map(ev=>{
      const d = parseDueDate(ev.dueDate);
      const cls = (d && d < todayMidnight) ? 'over' : 'normal';
      return `<span class="cal-dot ${cls}">${escapeHtml(ev.name||'(제목없음)')}</span>`;
    }).join('');
    const more = evs.length>3 ? `<span class="cal-dot normal">+${evs.length-3}건</span>` : '';
    cells += `<div class="cal-cell ${isToday?'today':''}" data-day="${day}">
      <div class="cal-daynum">${day}</div>
      <div class="cal-dot-list">${shown}${more}</div>
    </div>`;
  }

  body.innerHTML = `
    <p class="sub" style="margin:0 0 10px;">완료·연장·비노출 상태는 마감 알림 대상에서 빠져요. 어느 달 탭에 있든 반영예정일 기준으로 모아서 보여줘요.</p>
    <div class="cal-grid">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="cal-detail-list" id="calDetailList"><p class="sub" style="margin:0;">날짜를 클릭하면 그날 예정된 이벤트를 볼 수 있어요.</p></div>
  `;
  body.querySelectorAll('.cal-cell[data-day]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      const day = +cell.dataset.day;
      const evs = byDay[day]||[];
      const detail = document.getElementById('calDetailList');
      if(!evs.length){ detail.innerHTML = `<p class="sub" style="margin:0;">${m}월 ${day}일에는 마감 예정인 이벤트가 없어요.</p>`; return; }
      detail.innerHTML = `<div class="home-section-title" style="margin:0 0 8px;">${m}월 ${day}일 (${evs.length}건)</div>` + evs.map(ev=>`
        <div class="cal-detail-item">
          <span class="tag" style="background:${statusSoftVar(ev.status)}; color:${statusColorVar(ev.status)};">${escapeHtml(ev.status||'-')}</span>
          <div style="flex:1;"><div style="font-weight:600;">${escapeHtml(ev.name||'(제목없음)')}</div>
          <div style="color:var(--muted); font-size:11.5px;">${escapeHtml(ev.category||'')}</div></div>
        </div>`).join('');
    });
  });

  document.getElementById('calendarModalOverlay').classList.remove('hidden');
}
document.getElementById('calendarModalCloseBtn').addEventListener('click', ()=> document.getElementById('calendarModalOverlay').classList.add('hidden'));
document.getElementById('calendarModalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='calendarModalOverlay') document.getElementById('calendarModalOverlay').classList.add('hidden'); });

/* ════════════════════════════════════════════════════════════
   요약 리포트
   ════════════════════════════════════════════════════════════ */
function buildReportText(){
  const mo = getEventMonth(activeEventMonthKey);
  let done=0, prog=0, wait=0, ext=0, hidden=0;
  mo.events.forEach(ev=>{
    if(ev.status==='완료') done++; else if(ev.status==='진행') prog++;
    else if(ev.status==='대기') wait++; else if(ev.status==='연장') ext++; else if(ev.status==='비노출') hidden++;
  });
  const {overdue, dueSoon} = scanDeadlines(mo.events);
  const total = mo.events.length;
  const rate = total ? Math.round((done/total)*100) : 0;

  const lines = [];
  lines.push(`■ ${mo.label} 이벤트 운영 요약`);
  lines.push(`(작성: ${new Date().toLocaleDateString('ko-KR')})`);
  lines.push('');
  lines.push(`전체 ${total}건 중 완료 ${done}건 (완료율 ${rate}%)`);
  lines.push(`- 완료 ${done} · 진행 ${prog} · 대기 ${wait} · 연장 ${ext} · 비노출 ${hidden}`);
  lines.push('');
  if(overdue.length){
    lines.push(`⏰ 마감 지연 (${overdue.length}건)`);
    overdue.forEach(ev=> lines.push(`- ${ev.name||'(제목없음)'} (D+${Math.abs(ev.d)}, ${ev.status})`));
    lines.push('');
  }
  if(dueSoon.length){
    lines.push(`🟡 마감 임박 (${dueSoon.length}건)`);
    dueSoon.forEach(ev=> lines.push(`- ${ev.name||'(제목없음)'} (${ev.d===0?'오늘':'D-'+ev.d}, ${ev.status})`));
    lines.push('');
  }
  const doneList = mo.events.filter(ev=>ev.status==='완료');
  if(doneList.length){
    lines.push(`✅ 이번 달 완료 이벤트 (${doneList.length}건)`);
    doneList.forEach(ev=> lines.push(`- ${ev.name||'(제목없음)'}${ev.category?` · ${ev.category}`:''}`));
  }
  return lines.join('\n');
}

/* ════════════════════════════════════════════════════════════
   주차 계산 공통 함수
   ════════════════════════════════════════════════════════════ */
function computeCurrentWeek(mo){
  const anchor = new Date((mo.weekAnchor||'').replace(' ','T'));
  if(isNaN(anchor.getTime())) return 1;
  const now = new Date();
  const diffDays = (now - anchor) / 86400000;
  const cycle = mo.cycleWeeks || 4;
  return Math.max(1, Math.min(cycle, 1 + Math.floor(diffDays/7)));
}

function renderPmStatusGrid(){
  const mo = getBannerMonth(activeBannerMonthKey);
  const holder = document.getElementById('pmStatusGridHolder');
  if(!mo || !holder) return;

  const cycleWeeks = mo.cycleWeeks || 4;
  const week = computeCurrentWeek(mo);
  const anchor = new Date((mo.weekAnchor||'').replace(' ','T'));
  const deadline = !isNaN(anchor.getTime()) ? new Date(anchor.getTime() + (week-1)*7*86400000) : null;
  const now = new Date();
  const isLive = deadline && now >= deadline;
  const fmtDT = (d)=> !d || isNaN(d.getTime()) ? '-' : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const anchorInputVal = (mo.weekAnchor||'').slice(0,16);

  holder.innerHTML = `
    <div class="pm-status-grid">
      <div class="pm-status-item">
        <label>기준일시</label>
        <input type="datetime-local" id="pmAnchorInput" value="${anchorInputVal}"/>
      </div>
      <div class="pm-status-item">
        <label>배치 주기</label>
        <input type="number" id="pmCycleInput" min="1" max="12" value="${cycleWeeks}"/>
      </div>
      <div class="pm-status-item">
        <label>현재 관리 주차</label>
        <div class="pm-readonly">${week}주차</div>
      </div>
      <div class="pm-status-item">
        <label>게재 마감</label>
        <div class="pm-readonly">${fmtDT(deadline)}</div>
      </div>
      <div class="pm-status-item">
        <label>게재 상태</label>
        <div class="pm-readonly ${isLive?'badge-live':'badge-ready'}">${isLive?'게재 완료 확인':'게재 전 / 마감 전'}</div>
      </div>
    </div>
  `;

  document.getElementById('pmAnchorInput').addEventListener('change', (e)=>{
    mo.weekAnchor = e.target.value;
    scheduleSave(); renderPmStatusGrid(); renderPmWeekPreview();
  });
  document.getElementById('pmCycleInput').addEventListener('change', (e)=>{
    const v = Math.max(1, Math.min(12, parseInt(e.target.value)||4));
    mo.cycleWeeks = v;
    scheduleSave(); renderPmStatusGrid(); renderPmWeekPreview();
  });
}

function renderPmWeekPreview(){
  const mo = getBannerMonth(activeBannerMonthKey);
  const holder = document.getElementById('pmWeekPreviewHolder');
  if(!mo || !holder) return;
  if(!mo.preMarketingPartners) mo.preMarketingPartners = [];

  const cycleWeeks = mo.cycleWeeks || 4;
  const existingRanks = mo.preMarketingPartners.map(p=>p.rankInWeek||1);
  const maxRank = Math.max(6, existingRanks.length ? Math.max(...existingRanks) : 0);
  const currentWeek = computeCurrentWeek(mo);

  let html = '<div class="pm-week-grid">';
  for(let w=1; w<=cycleWeeks; w++){
    html += `<div class="pm-week-col ${w===currentWeek?'current':''}">
      <div class="pm-week-title">${w}주차${w===currentWeek?' · 진행중':''}</div>`;
    for(let rk=1; rk<=maxRank; rk++){
      const entry = mo.preMarketingPartners.find(p=>p.week===w && p.rankInWeek===rk);
      const name = entry ? (entry.name||'') : '';
      html += `<div class="pm-week-row">
        <span class="pm-week-rank">${rk}위</span>
        <input type="text" class="pm-week-input" data-week="${w}" data-rank="${rk}" value="${escapeHtml(name)}" placeholder="파트너사명"/>
      </div>`;
    }
    html += `</div>`;
  }
  html += '</div>';
  holder.innerHTML = html;

  holder.querySelectorAll('.pm-week-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const w = +inp.dataset.week, rk = +inp.dataset.rank;
      let entry = mo.preMarketingPartners.find(p=>p.week===w && p.rankInWeek===rk);
      if(!entry){
        entry = {_uid:uid(), name:'', week:w, rankInWeek:rk};
        mo.preMarketingPartners.push(entry);
      }
      entry.name = inp.value;
      scheduleSave();
    });
  });
}

/* ════════════════════════════════════════════════════════════
   렌더: 혜택 관리 탭 (블록은 배열 index 0 = 최신)
   ════════════════════════════════════════════════════════════ */
function benefitExpiryStyle(expiryDate){
  if(!expiryDate) return {style:'', title:'혜택 종료일 (선택)'};
  const [y,m,d] = expiryDate.split('-').map(Number);
  if(!y) return {style:'', title:'혜택 종료일'};
  const exp = new Date(y, m-1, d);
  const today = new Date();
  const days = Math.round((new Date(exp.getFullYear(),exp.getMonth(),exp.getDate()) - new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  if(days < 0) return {style:`background:var(--fatal-soft); border-color:var(--fatal-border); color:var(--fatal-text);`, title:`${Math.abs(days)}일 지난 혜택이에요. 종료 처리해주세요.`};
  if(days <= 7) return {style:`background:var(--minor-soft); border-color:var(--minor-border); color:var(--minor-text);`, title:`${days===0?'오늘 만료':`D-${days}`} — 곧 종료돼요.`};
  return {style:'', title:'혜택 종료일'};
}

function formatBenefitLabel(label){
  if(!label) return label;
  if(label.includes('년')) return label; // 이미 'OO년 O월' 형식
  const m = label.match(/^(\d{1,2})월$/);
  if(m){
    const evMonth = getEventMonth(activeEventMonthKey);
    const yy = evMonth ? evMonth.key.slice(2,4) : String(new Date().getFullYear()).slice(-2);
    return `${yy}년 ${m[1]}월`;
  }
  return label;
}

  `;
  }).join('');

  holder.querySelectorAll('.accordion-toggle').forEach(headEl=>{
    headEl.addEventListener('click', (e)=>{
      if(e.target.closest('.bb-head-actions')) return;
      const blockUid = headEl.dataset.blockuid;
      if(expandedBenefitBlocks.has(blockUid)) expandedBenefitBlocks.delete(blockUid);
      else expandedBenefitBlocks.add(blockUid);
      renderBenefitBlocks();
    });
  });

  holder.querySelectorAll('.benefit-block').forEach(blockEl=>{
    const bIdx = +blockEl.dataset.bidx;
    const block = STATE.benefitBlocks[bIdx];
    blockEl.querySelector('.add-benefit-item-btn').addEventListener('click', ()=>{
      block.items.push({_uid:uid(), name:'', copy:'', status:'', expiryDate:''});
      expandedBenefitBlocks.add(block._blockUid);
      scheduleSave(); renderBenefitBlocks();
    });
    const delBlockBtn = blockEl.querySelector('.del-benefit-block-btn');
    if(delBlockBtn) delBlockBtn.addEventListener('click', ()=>{
      showConfirmModal(`'${block.label}' 블록을 삭제할까요?`, ()=>{
        expandedBenefitBlocks.delete(block._blockUid);
        STATE.benefitBlocks.splice(bIdx,1); scheduleSave(); renderBenefitBlocks();
      });
    });
    blockEl.querySelectorAll('.benefit-row').forEach(rowEl=>{
      const iIdx = +rowEl.dataset.iidx;
      rowEl.querySelectorAll('.bf-field').forEach(inp=>{
        inp.addEventListener('input', ()=>{ block.items[iIdx][inp.dataset.field] = inp.value; scheduleSave(); });
      });
      rowEl.querySelector('.del-benefit-item-btn').addEventListener('click', ()=>{
        showConfirmModal('이 혜택 항목을 삭제할까요?', ()=>{
          block.items.splice(iIdx,1); scheduleSave(); renderBenefitBlocks();
        });
      });
    });
  });
}

function addNewBenefitBlock(){
  showPromptModal('새 블록 이름을 입력하세요 (예: 8월)', '', (label)=>{
    const copyFrom = STATE.benefitBlocks[0];
    const finish = (doCopy)=>{
      const items = doCopy ? copyFrom.items.map(it=>({...it, _uid:uid()})) : [];
      const newBlockUid = uid();
      STATE.benefitBlocks.unshift({label, items, _blockUid: newBlockUid});
      expandedBenefitBlocks = new Set([newBlockUid]);
      logActivity('🎁', `'${label}' 혜택 블록 생성`, doCopy ? '이전 블록 항목 복사' : '', 'benefit');
      scheduleSave(); renderBenefitTab();
    };
    if(copyFrom && copyFrom.items.length){
      showConfirmModal('직전 블록의 항목을 복사해서 시작할까요?', ()=> finish(true), ()=> finish(false));
    }else{
      finish(false);
    }
  });
}

let GITHUB_CONFIG = { token:'', owner:'', repo:'', branch:'main', path:'alddot-history.json' };
let activeExportFilter = '전체';

async function loadGithubConfig(){
  try{
    if(hasClaudeStorage()){
      const res = await window.storage.get('alddot_github_config');
      if(res && res.value) GITHUB_CONFIG = JSON.parse(res.value);
    }else{
      const raw = localStorage.getItem('alddot_github_config');
      if(raw) GITHUB_CONFIG = JSON.parse(raw);
    }
  }catch(err){ /* 저장된 설정 없음 또는 스토리지 미지원 */ }
}
async function saveGithubConfig(){
  try{
    if(hasClaudeStorage()) await window.storage.set('alddot_github_config', JSON.stringify(GITHUB_CONFIG), false);
    else localStorage.setItem('alddot_github_config', JSON.stringify(GITHUB_CONFIG));
  }catch(err){ /* 무시: 다음 세션엔 다시 연결 필요 */ }
}
function parseRepoInput(input){
  const cleaned = input.trim().replace(/^https?:\/\//,'').replace(/^github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  const parts = cleaned.split('/').filter(Boolean);
  if(parts.length<2) return null;
  return { owner: parts[0], repo: parts[1] };
}
function buildBackupPayload(){
  return JSON.stringify({
    eventMonths: STATE.eventMonths, bannerMonths: STATE.bannerMonths,
    benefitBlocks: STATE.benefitBlocks, eventRequests: STATE.eventRequests||[]
  }, null, 2);
}
function restoreFromPayload(json, onlyDomain){
  const data = JSON.parse(json);
  if(!data.eventMonths && !data.bannerMonths && !data.benefitBlocks) throw new Error('올바른 백업 데이터가 아니에요.');
  if((!onlyDomain || onlyDomain==='이벤트') && data.eventMonths) STATE.eventMonths = data.eventMonths;
  if((!onlyDomain || onlyDomain==='배너') && data.bannerMonths) STATE.bannerMonths = data.bannerMonths;
  if((!onlyDomain || onlyDomain==='혜택관리') && data.benefitBlocks) STATE.benefitBlocks = data.benefitBlocks;
  if(!onlyDomain && data.eventRequests) STATE.eventRequests = data.eventRequests;
  ensureStateShape();
  activeEventMonthKey = getDefaultActiveEventMonthKey();
  activeBannerMonthKey = getDefaultActiveBannerMonthKey();
  scheduleSave();
  renderEventsTab(); renderBannerTab(); renderBenefitTab(); renderHomeTab();
}

function recordExportSnapshot(channel, label){
  if(!STATE.exportHistory) STATE.exportHistory = [];
  const at = new Date().toISOString();

  let total=0, done=0, error=0, unconfirmed=0;
  STATE.eventMonths.forEach(mo=> mo.events.forEach(ev=>{
    total++;
    if(ev.status==='완료') done++;
    else if(ev.status==='비노출') error++;
    else unconfirmed++;
  }));
  STATE.exportHistory.unshift({
    id: uid(), at, type:'이벤트', channel, label: `${channel} · ${label}`,
    counts: { total, done, error, unconfirmed, months: STATE.eventMonths.length },
    snapshot: JSON.stringify({eventMonths: STATE.eventMonths}),
  });

  const bannerRankTotal = STATE.bannerMonths.reduce((s,mo)=>s+mo.ranks.length,0);
  STATE.exportHistory.unshift({
    id: uid(), at, type:'배너', channel, label: `${channel} · ${label}`,
    counts: { months: STATE.bannerMonths.length, ranks: bannerRankTotal },
    snapshot: JSON.stringify({bannerMonths: STATE.bannerMonths}),
  });

  const benefitItemTotal = STATE.benefitBlocks.reduce((s,b)=>s+b.items.length,0);
  STATE.exportHistory.unshift({
    id: uid(), at, type:'혜택관리', channel, label: `${channel} · ${label}`,
    counts: { blocks: STATE.benefitBlocks.length, items: benefitItemTotal },
    snapshot: JSON.stringify({benefitBlocks: STATE.benefitBlocks}),
  });

  if(STATE.exportHistory.length>90) STATE.exportHistory.length=90;
  scheduleSave();
}

async function testAndSaveGithubConnection(){
  const token = document.getElementById('ghTokenInput').value.trim();
  const repoInput = document.getElementById('ghRepoInput').value.trim();
  const branch = document.getElementById('ghBranchInput').value.trim() || 'main';
  const path = document.getElementById('ghPathInput').value.trim() || 'alddot-history.json';
  const statusEl = document.getElementById('ghStatusText');
  const btn = document.getElementById('ghConnectBtn');

  if(!token || !repoInput){ showError('토큰과 저장소 주소를 모두 입력해주세요.'); return; }
  const parsed = parseRepoInput(repoInput);
  if(!parsed){ showError("저장소 주소 형식을 확인해주세요. 예: github.com/my-org/alddot-history"); return; }

  clearError();
  setBtnLoading(btn, '연결 확인 중...');
  statusEl.textContent = '';
  try{
    const res = await fetch(`https://api.github.com/repos/${parsed.owner}/${parsed.repo}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if(!res.ok){
      if(res.status===404) showError('저장소를 찾을 수 없어요. 주소를 확인하거나, 토큰에 이 저장소 권한이 있는지 확인해주세요.');
      else if(res.status===401) showError('토큰이 올바르지 않아요. 다시 발급받아 붙여넣어주세요.');
      else showError(`연결에 실패했어요 (상태 코드 ${res.status}).`);
      resetBtn(btn); return;
    }
    GITHUB_CONFIG = { token, owner: parsed.owner, repo: parsed.repo, branch, path };
    await saveGithubConfig();
    statusEl.textContent = '✅ 연결됨';
    showToast('GitHub 저장소에 연결했어요.');
    renderGithubActions();
  }catch(err){
    showError('연결 중 문제가 발생했어요: ' + err.message + ' (네트워크 또는 CORS 문제일 수 있어요)');
  }
  resetBtn(btn);
}

async function pushToGithub(){
  const btn = document.getElementById('ghPushBtn');
  clearError();
  setBtnLoading(btn, '저장하는 중...');
  try{
    const { owner, repo, branch, path, token } = GITHUB_CONFIG;
    let sha = null;
    const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${branch}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if(getRes.ok){ const getData = await getRes.json(); sha = getData.sha; }

    const payload = buildBackupPayload();
    const content = btoa(unescape(encodeURIComponent(payload)));
    const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({ message: `알닷 관리대장 백업 (${new Date().toLocaleString('ko-KR')})`, content, branch, ...(sha?{sha}:{}) })
    });
    if(!putRes.ok){ const err = await putRes.json().catch(()=>({})); throw new Error(err.message || `상태 코드 ${putRes.status}`); }

    recordExportSnapshot('GitHub', `${owner}/${repo} · ${path}`);
    renderExportFilterRow(); renderExportHistoryList();
    showToast('GitHub 저장소에 저장했어요.');
  }catch(err){
    showError('GitHub 저장 중 문제가 발생했어요: ' + err.message);
  }
  resetBtn(btn);
}

async function pullFromGithub(){
  const btn = document.getElementById('ghPullBtn');
  clearError();
  setBtnLoading(btn, '불러오는 중...');
  try{
    const { owner, repo, branch, path, token } = GITHUB_CONFIG;
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?ref=${branch}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    if(!res.ok){ throw new Error(res.status===404 ? '저장소에 아직 백업 파일이 없어요.' : `상태 코드 ${res.status}`); }
    const data = await res.json();
    const json = decodeURIComponent(escape(atob(data.content.replace(/\s/g,''))));
    resetBtn(btn);
    showConfirmModal('GitHub에 저장된 내용으로 지금 데이터를 덮어쓸까요?', ()=>{
      try{
        restoreFromPayload(json);
        showToast('GitHub에서 불러왔어요.');
      }catch(err){ showError('불러오기 중 문제가 발생했어요: ' + err.message); }
    });
  }catch(err){
    showError('GitHub에서 불러오는 중 문제가 발생했어요: ' + err.message);
    resetBtn(btn);
  }
}

function renderHomeTab(){
  const container = document.getElementById('tab-home');
  const evMonth = getEventMonth(activeEventMonthKey) || STATE.eventMonths[STATE.eventMonths.length-1];
  let done=0, prog=0, wait=0, ext=0;
  evMonth.events.forEach(ev=>{
    if(ev.status==='완료') done++; else if(ev.status==='진행') prog++;
    else if(ev.status==='대기') wait++; else if(ev.status==='연장') ext++;
  });

  const {overdue, dueSoon} = scanDeadlines(evMonth.events);

  const bannerMonth = getBannerMonth(activeBannerMonthKey) || STATE.bannerMonths[STATE.bannerMonths.length-1];

/* ════════════════════════════════════════════════════════════
   기존 엑셀 불러오기
   ════════════════════════════════════════════════════════════ */
const EVENT_SHEET_RE = /^(\d{2})년\s*(\d{1,2})월(\s*이벤트\s*관리)?$/;

// 과거 시트들은 헤더 위치·컬럼명이 제각각이라, 텍스트 기반으로 유연하게 찾는다
const LEGACY_FIELD_MAP = {
  name: ['이벤트명','이벤트및컨텐츠명'],
  priority: ['우선순위'],
  status: ['상태','퍼블리싱','진행상태'],
  workType: ['작업유형','작업'],
  category: ['구분'],
  dueDate: ['반영예정일','반영일자'],
  reflectStatus: ['반영상태','개발기반영','stg반영'],
  source: ['소스수급','디자인주체','디자인'],
  reviewUrl: ['검수용url'],
  urlType: ['url유형'],
  opUrl: ['운영기url','운영url'],
  id: ['이벤트id'],
  note: ['주요특이사항','비고'],
};
function normHeaderText(s){ return s==null ? '' : String(s).replace(/\s/g,'').toLowerCase(); }

function detectEventSheetLayout(grid){
  let bestRow = null, bestCount = 0, bestFieldCols = null;
  for(let r=1; r<=Math.min(20, grid.length); r++){
    const row = grid[r-1] || [];
    const fieldCols = {};
    let count = 0;
    row.forEach((cellVal, idx)=>{
      const norm = normHeaderText(cellVal);
      if(!norm || norm.length>20) return;
      for(const [field, variants] of Object.entries(LEGACY_FIELD_MAP)){
        if(fieldCols[field]) continue;
        for(const variant of variants){
          if(norm===variant || norm.startsWith(variant)){ fieldCols[field] = idx+1; count++; break; }
        }
      }
    });
    if(count > bestCount){ bestCount = count; bestRow = r; bestFieldCols = fieldCols; }
  }
  if(bestCount < 2 || !bestFieldCols || !bestFieldCols.name) return null;
  return { headerRow: bestRow, fieldCols: bestFieldCols };
}
function normalizeDateValue(v){
  if(v===null || v===undefined || v==='') return '';
  if(typeof v === 'number' && v > 20000 && v < 60000){
    try{
      const d = XLSX.SSF.parse_date_code(v);
      if(d && d.y) return `${d.y}.${String(d.m).padStart(2,'0')}.${String(d.d).padStart(2,'0')}`;
    }catch(e){ /* 변환 실패 시 원본 값 그대로 사용 */ }
  }
  return String(v);
}
const RANK_TABLE_HEADER = "02. 노출 순위별 배정 현황";
const BENEFIT_SHEET = "알닷 혜택";
const BENEFIT_BLOCK_RE = /■\s*알닷\s*혜택\s*\(([^)]+)\)/;

function sheetToGrid(ws){ if(!ws || !ws['!ref']) return []; return XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true}); }
function cellAt(grid,r,c){ const row = grid[r-1]; if(!row) return null; const v = row[c-1]; return v===undefined?null:v; }

/* ════════════════════════════════════════════════════════════
   사업팀 원본파일(운영계획) → 관리용 01/02/03 구조로 변환
   ════════════════════════════════════════════════════════════ */
const RAW_SHEET_RE = /^(\d{4})\.(\d{1,2})월/;
const BANNER_SLOT_DEFS = [
  { key:'이벤트/썸네일', match:['이벤트페이지&썸네일','이벤트페이지'] },
  { key:'메인 팝업', match:['메인팝업'] },
  { key:'메인 상단', match:['메인상단배너','메인상단'] },
  { key:'메인 하단', match:['메인하단배너','메인하단'] },
  { key:'GNB검색배너', match:['GNB검색배너','GNB검색'] },
  { key:'더 받을 수 있는 쿠폰', match:['더받을수있는쿠폰'] },
  { key:'요금제 배너', match:['요금제배너'] },
];
const FULL_COMBO = '메인팝업,메인상단,메인하단,이벤트페이지,썸네일';
const REDUCED_COMBO = '메인상단, 메인하단,이벤트페이지,썸네일';

function normHeader(s){ return s==null ? '' : String(s).replace(/\s/g,''); }
function findColByText(grid, row, matchTexts){
  const arr = grid[row-1] || [];
  for(let c=0;c<arr.length;c++){
    const v = normHeader(arr[c]);
    if(!v) continue;
    for(const m of matchTexts){ if(v.includes(m)) return c+1; }
  }
  return null;
}
function findRowByColBText(grid, text, fromRow=1){
  for(let r=fromRow;r<=grid.length;r++){
    const v = grid[r-1] && grid[r-1][1]; // 컬럼 B
    if(typeof v==='string' && v.replace(/\s/g,'').includes(text)) return r;
  }
  return null;
}

function findLatestRawSheet(wb){
  const candidates = wb.SheetNames
    .map(n=>({name:n, m:n.match(RAW_SHEET_RE)}))
    .filter(x=>x.m)
    .map(x=>({name:x.name, y:+x.m[1], mo:+x.m[2]}));
  if(!candidates.length) return null;
  candidates.sort((a,b)=> (a.y-b.y) || (a.mo-b.mo));
  return candidates[candidates.length-1];
}

function parseRawBannerPlan(wb, sheetInfo){
  const ws = wb.Sheets[sheetInfo.name];
  const grid = sheetToGrid(ws);

  // 1) 구좌별 컬럼 위치 찾기 (헤더 텍스트 기반, 매달 컬럼 순서가 달라도 안전)
  const slotCols = [];
  BANNER_SLOT_DEFS.forEach(def=>{
    const col = findColByText(grid, 4, def.match);
    if(col) slotCols.push({ ...def, col });
  });

  // 2) 변경사항(운영방식) 행 찾기
  const changeRow = findRowByColBText(grid, '변경사항');

  // 3) 01. 구좌 운영 기준
  const criteria = slotCols.map(sc=>({
    name: sc.key,
    maxExposure: cellAt(grid,5,sc.col) || '-',
    preMarketing: cellAt(grid,6,sc.col) || '-',
    operation: (changeRow ? cellAt(grid,changeRow,sc.col) : null) || '고정/수시 운영',
    note: '',
  }));

  // 4) 02. 노출 순위별 배정 현황 (컬럼별 값 그대로 전사 — 원본에 없는 신규 파트너는 사람이 채워야 함)
  const rankStartRow = findRowByColBText(grid, '노출순위') || findRowByColBText(grid, '노출 순위');
  const ranks = [];
  if(rankStartRow){
    let r = rankStartRow, blank = 0;
    while(r<=grid.length){
      const rowVals = {};
      let hasAny = false;
      slotCols.forEach(sc=>{
        const v = cellAt(grid,r,sc.col);
        if(v!==null && v!=='' && v!=='-'){ rowVals[sc.key]=v; hasAny=true; }
      });
      if(!hasAny){ blank++; if(blank>=2) break; r++; continue; }
      blank=0;
      ranks.push(rowVals);
      r++;
    }
  }

  // 5) 03. 파트너/주차 운영 리스트 ('정리' 블록 — 헤더 텍스트로 컬럼 위치 탐색)
  const anchorCol = findColByText(grid, 4, ['정리']);
  const partners = [];
  if(anchorCol){
    const orderCol = anchorCol;
    const bizCol = findColByText(grid, 7, ['사업자명']) || anchorCol+1;
    const joinCol = findColByText(grid, 6, ['참여여부']);
    const materialCol = findColByText(grid, 6, ['소재전달']);
    const headerRow = 7;
    let r = headerRow+1, blank=0;
    while(r<=grid.length){
      const order = cellAt(grid,r,orderCol);
      const biz = cellAt(grid,r,bizCol);
      if(!order && !biz){ blank++; if(blank>=2) break; r++; continue; }
      if(!biz){ r++; continue; }
      blank=0;
      const idx = partners.length; // 0-based 배너순서 산정용
      const week = (idx % 4) + 1;
      const rankInWeek = Math.floor(idx / 4) + 1;
      partners.push({
        bannerOrder: idx+1,
        perfRank: order,
        name: biz,
        weekLabel: `${week}주차 ${rankInWeek}위`,
        week, rankInWeek,
        combo: FULL_COMBO, // 기본값: 전체 구성. 상위/하위 구분은 원본만으로 확정할 수 없어 사람이 확인 필요
        estimated: true,
      });
      r++;
    }
  }

  // 6) 프리마케팅 제공 순위 ('03. 파트너/주차 운영 리스트'의 실적순위와는 별개의 표 —
  //    '프리 주차별 N위' 플레이스홀더는 반드시 이 표를 기준으로 채워야 함)
  //    이름이 비어있는 순위(다음 배정 대기 등)도 자리 자체는 그대로 유지해야
  //    이후 순번들의 '몇 주차 몇 위' 위치가 밀리지 않는다.
  const preMarketingPartners = [];
  const preRankCol = findColByText(grid, 6, ['프리마케팅제공순위','프리마케팅제공']);
  if(preRankCol){
    const preBizCol = preRankCol + 1; // 관찰된 원본 구조상 순위 바로 옆 열이 사업자명
    let r = 8, blank = 0; // '정리' 표와 같은 데이터 시작행(헤더 2행 다음)
    while(r<=grid.length){
      const order = cellAt(grid,r,preRankCol);
      const biz = cellAt(grid,r,preBizCol);
      const hasOrder = order!==null && String(order).trim()!=='';
      if(!hasOrder && (biz===null || String(biz).trim()==='')){
        blank++; if(blank>=2) break; r++; continue;
      }
      blank=0;
      const idx = preMarketingPartners.length;
      const week = (idx % 4) + 1;
      const rankInWeek = Math.floor(idx / 4) + 1;
      preMarketingPartners.push({ name: (biz && String(biz).trim()) || '', week, rankInWeek, preRank: hasOrder ? order : '-' });
      r++;
    }
  }

  return { monthLabel: `${sheetInfo.y}년 ${sheetInfo.mo}월`, sheetName: sheetInfo.name, criteria, ranks, slotCols, partners, preMarketingPartners };
}

function buildBannerManagementWorkbook(parsed){
  const yy = parsed.monthLabel.match(/(\d{4})년/)[1].slice(2);
  const mm = parsed.monthLabel.match(/(\d+)월/)[1];
  const newSheetName = `${yy}년 ${mm}월 이벤트 배너 구좌 관리`;
  const rows = [];
  rows.push([`${yy}년 ${mm}월 이벤트 배너 구좌 관리 (자동 변환 초안 — 검수 필요)`]);
  rows.push([`업데이트 일자: ${new Date().toISOString().slice(5,10).replace('-','/')}`]);
  rows.push(['🤖 AI가 자동 생성한 내용이니 검수가 필요합니다. 특히 신규 파트너명 추가 여부를 꼭 확인해주세요.']);
  rows.push([]);
  rows.push(['01. 구좌 운영 기준']);
  rows.push(['No.','구좌명','최대 노출','프리마케팅 배정','운영 방식','비고']);
  parsed.criteria.forEach((c,i)=> rows.push([i+1, c.name, c.maxExposure, c.preMarketing, c.operation, c.note]));
  rows.push([]);
  rows.push(['02. 노출 순위별 배정 현황']);
  const slotNames = parsed.slotCols.map(s=>s.key);
  rows.push(['순위', ...slotNames]);
  parsed.ranks.forEach((row,i)=> rows.push([i+1, ...slotNames.map(k=>row[k]||'')]));
  rows.push([]);
  rows.push(['03. 파트너/주차 운영 리스트', null, null, null, null, null, null, '자동 주차 설정']);
  rows.push(['배너 순서','실적 순위','파트너사','순서','제공 구좌(추정 — 확인 필요)', null, null, '기준일시', new Date()]);
  parsed.partners.forEach(p=> rows.push([p.bannerOrder, p.perfRank, p.name, p.weekLabel, p.combo]));

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, newSheetName.slice(0,31));
  return { wb, newSheetName };
}
