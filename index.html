  if(STATE.bannerMonths.some(m=>m.key===key)){
    showConfirmModal(`'${label}' 배너 구좌 데이터가 이미 있어요. 덮어쓸까요?`, ()=>{
      STATE.bannerMonths = STATE.bannerMonths.filter(m=>m.key!==key);
      doApply();
    }, ()=> closeConvertModal());
  }else{
    doApply();
  }
});

function handleRawFileImport(file, btn){
  clearError();
  setBtnLoading(btn, '변환하는 중...');
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:false});
      const sheetInfo = findLatestRawSheet(wb);
      if(!sheetInfo){
        showError("'YYYY.M월' 형식의 운영계획 시트를 찾지 못했어요. 사업팀에서 받은 원본 파일이 맞는지 확인해주세요.");
      }else{
        const parsed = parseRawBannerPlan(wb, sheetInfo);
        if(!parsed.criteria.length && !parsed.ranks.length){
          showError('구좌 정보를 찾지 못했어요. 시트 구조가 예상과 달라요.');
        }else{
          openConvertModal(parsed);
        }
      }
    }catch(err){
      showError('원본 파일을 읽는 중 문제가 발생했어요: ' + err.message);
    }
    resetBtn(btn);
  };
  reader.onerror = ()=>{ showError('파일을 읽지 못했어요. 다시 시도해주세요.'); resetBtn(btn); };
  reader.readAsArrayBuffer(file);
}

function importFromWorkbook(wb){
  const eventMonths = [];
  const skippedSheets = [];
  wb.SheetNames.forEach(name=>{
    const m = name.match(EVENT_SHEET_RE);
    if(!m) return;
    const yy=+m[1], mm=+m[2];
    const key = `${2000+yy}-${String(mm).padStart(2,'0')}`;
    const label = `${m[1]}년 ${mm}월`;
    const grid = sheetToGrid(wb.Sheets[name]);

    const layout = detectEventSheetLayout(grid);
    if(!layout){ skippedSheets.push(name); return; }

    const get = (r, field)=> layout.fieldCols[field] ? cellAt(grid, r, layout.fieldCols[field]) : null;
    const events = [];
    let r = layout.headerRow+1, blank=0;
    while(r<=grid.length){
      const nm = get(r,'name');
      if(!nm){ blank++; if(blank>=3) break; r++; continue; }
      blank=0;
      const idVal = get(r,'id');
      events.push({
        _uid: uid(),
        priority: get(r,'priority')||'', status: get(r,'status')||'', name: nm,
        workType: get(r,'workType')||'', category: get(r,'category')||'',
        dueDate: normalizeDateValue(get(r,'dueDate')), reflectStatus: get(r,'reflectStatus')||'',
        source: get(r,'source')||'', reviewUrl: get(r,'reviewUrl')||'',
        urlType: get(r,'urlType')||'', opUrl: get(r,'opUrl')||'',
        id: (idVal!==null && idVal!==undefined) ? String(idVal) : '', note: get(r,'note')||''
      });
      r++;
    }
    eventMonths.push({key, label, events});

    // 같은 달의 배너 구좌 관리 시트가 있으면 함께 가져오기
    const bannerSheetName = name.replace(' 이벤트 관리',' 이벤트 배너 구좌 관리');
    if(wb.SheetNames.includes(bannerSheetName)){
      try{
        const bgrid = sheetToGrid(wb.Sheets[bannerSheetName]);
        let headerRow=null;
        for(let r=1;r<=bgrid.length;r++){ const v=cellAt(bgrid,r,1); if(typeof v==='string' && v.includes(RANK_TABLE_HEADER)){headerRow=r;break;} }
        if(headerRow){
          const colHeaderRow = headerRow+1;
          const maxCol = (bgrid[colHeaderRow-1]||[]).length;
          const columns = [];
          const colIdx = {};
          for(let c=1;c<=maxCol;c++){ const nm2=cellAt(bgrid,colHeaderRow,c); if(typeof nm2==='string' && nm2.trim() && nm2.trim()!=='순위'){ columns.push(nm2.trim()); colIdx[nm2.trim()]=c; } }
          const ranks = [];
          let r=colHeaderRow+1, blank=0;
          while(r<=bgrid.length){
            const hasVal = columns.some(cn=>{const v=cellAt(bgrid,r,colIdx[cn]); return v!==null && v!=='';});
            if(!hasVal){ blank++; if(blank>=2) break; r++; continue; }
            blank=0;
            const values={};
            columns.forEach(cn=> values[cn]=cellAt(bgrid,r,colIdx[cn])||'');
            ranks.push({_uid:uid(), values});
            r++;
          }
          if(!window.__importedBannerMonths) window.__importedBannerMonths=[];
          window.__importedBannerMonths.push({key,label,columns,ranks});
        }
      }catch(err){ /* 배너 구좌 관리 시트 형식이 달라도 이벤트 가져오기는 계속 진행 */ }
    }
  });

  // '알닷 배너 구좌' 마스터 시트: 월별 관리 시트 하나로는 못 잡는 지난 달 이력 블록들을 추가로 가져온다.
  // (이미 위에서 월별 관리 시트로 가져온 달은 건너뛰고, 구좌명 헤더가 없는 옛 형식 블록은 안전하게 건너뛴다)
  const BANNER_BLOCK_RE = /■\s*알닷\s*배너\s*구좌\s*\(([^)]+)\)/;
  const skippedBannerBlocks = [];
  if(wb.SheetNames.includes('알닷 배너 구좌')){
    try{
      const grid = sheetToGrid(wb.Sheets['알닷 배너 구좌']);
      let runningYear = eventMonths.length ? +eventMonths[eventMonths.length-1].key.slice(0,4) : new Date().getFullYear();
      let lastMonthNum = null; // 블록이 새달→구달 순으로 내려가다 월이 다시 커지면(예: 2월→12월) 연도가 하나 내려간 것으로 본다
      let r = 1;
      while(r<=grid.length){
        const v = cellAt(grid,r,1);
        if(typeof v==='string'){
          const bm = v.match(BANNER_BLOCK_RE);
          if(bm){
            const rawLabel = bm[1].trim();
            const monthMatch = rawLabel.match(/(\d{1,2})월/);
            const nextRowVal = cellAt(grid, r+1, 1);
            const hasProperHeader = typeof nextRowVal==='string' && nextRowVal.includes('노출');
            if(!monthMatch || !hasProperHeader){
              skippedBannerBlocks.push(rawLabel);
              r++; continue;
            }
            const mm2 = +monthMatch[1];
            if(lastMonthNum!==null && mm2>lastMonthNum) runningYear -= 1;
            lastMonthNum = mm2;
            const key = `${runningYear}-${String(mm2).padStart(2,'0')}`;
            const label = `${String(runningYear).slice(2)}년 ${mm2}월`;
            const colHeaderRow = r+1;
            const rowArr = grid[colHeaderRow-1] || [];
            const columns = [];
            const colIdx = {};
            rowArr.forEach((cellVal, idx)=>{
              const cname = (cellVal==null) ? '' : String(cellVal).trim();
              if(cname && cname!=='노출순위'){ columns.push(cname); colIdx[cname]=idx+1; }
            });
            let rr = colHeaderRow+1, blank=0;
            const ranks = [];
            while(rr<=grid.length){
              const nextHeader = cellAt(grid,rr,1);
              if(typeof nextHeader==='string' && BANNER_BLOCK_RE.test(nextHeader)) break;
              const hasVal = columns.some(cn=>{ const vv=cellAt(grid,rr,colIdx[cn]); return vv!==null && vv!==''; });
              if(!hasVal){ blank++; if(blank>=2) break; rr++; continue; }
              blank=0;
              const values={};
              columns.forEach(cn=> values[cn]=cellAt(grid,rr,colIdx[cn])||'');
              ranks.push({_uid:uid(), values});
              rr++;
            }
            if(!window.__importedBannerMonths) window.__importedBannerMonths=[];
            const already = window.__importedBannerMonths.some(x=>x.key===key);
            if(!already && columns.length){
              window.__importedBannerMonths.push({key, label, columns, ranks});
            }
            r = rr; continue;
          }
        }
        r++;
      }
    }catch(err){ /* 마스터 시트 형식이 달라도 나머지 가져오기는 계속 진행 */ }
  }

  const benefitBlocks = [];
  if(wb.SheetNames.includes(BENEFIT_SHEET)){
    const grid = sheetToGrid(wb.Sheets[BENEFIT_SHEET]);
    let r = 1;
    while(r<=grid.length){
      const v = cellAt(grid,r,1);
      if(typeof v==='string'){
        const m = v.match(BENEFIT_BLOCK_RE);
        if(m){
          const label = m[1];
          const items = [];
          let rr = r+2, blank=0;
          while(rr<=grid.length){
            const name = cellAt(grid,rr,2), copy = cellAt(grid,rr,3);
            if(!name && !copy){ blank++; if(blank>=2) break; rr++; continue; }
            blank=0;
            items.push({_uid:uid(), name:name||'', copy:copy||'', status: cellAt(grid,rr,4)||''});
            rr++;
          }
          benefitBlocks.push({label, items});
          r = rr; continue;
        }
      }
      r++;
    }
  }

  eventMonths.sort((a,b)=> a.key<b.key?-1:1);
  return { eventMonths, benefitBlocks, bannerMonths: window.__importedBannerMonths || [], skippedSheets, skippedBannerBlocks };
}

function bindXlsxButtons(importBtnId, exportBtnId, fileInputId){
  const importBtn = document.getElementById(importBtnId);
  const fileInput = document.getElementById(fileInputId);
  if(importBtn && fileInput){
    importBtn.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(file) handleXlsxImportFile(file, importBtn);
      e.target.value = '';
    });
  }
  const exportBtn = document.getElementById(exportBtnId);
  if(exportBtn) exportBtn.addEventListener('click', ()=> handleXlsxExport(exportBtn));
}

function handleXlsxImportFile(file, btn){
  clearError();
  setBtnLoading(btn, '불러오는 중...');
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      window.__importedBannerMonths = [];
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:false});
      const imported = importFromWorkbook(wb);
      if(!imported.eventMonths.length){
        showError("'NN년 N월 이벤트 관리' 형식의 시트를 찾지 못했어요. 파일 구조를 확인해주세요.");
        resetBtn(btn); return;
      }

      const finishImport = (mode)=>{
        if(mode){
          imported.eventMonths.forEach(m=>{ if(!STATE.eventMonths.some(x=>x.key===m.key)) STATE.eventMonths.push(m); });
          imported.bannerMonths.forEach(m=>{ if(!STATE.bannerMonths.some(x=>x.key===m.key)) STATE.bannerMonths.push(m); });
          STATE.benefitBlocks = [...imported.benefitBlocks, ...STATE.benefitBlocks];
        }else{
          STATE.eventMonths = imported.eventMonths;
          STATE.bannerMonths = imported.bannerMonths.length ? imported.bannerMonths : STATE.bannerMonths;
          STATE.benefitBlocks = imported.benefitBlocks;
        }
        STATE.eventMonths.sort((a,b)=> a.key<b.key?-1:1);
        STATE.bannerMonths.sort((a,b)=> a.key<b.key?-1:1);
        ensureStateShape();
        activeEventMonthKey = getDefaultActiveEventMonthKey();
        activeBannerMonthKey = getDefaultActiveBannerMonthKey();
        logActivity('📄', '엑셀 불러오기', `이벤트 ${imported.eventMonths.length}개월 · 배너 ${imported.bannerMonths.length}개월 · 혜택 ${imported.benefitBlocks.length}개 블록`, null);
        scheduleSave();
        renderEventsTab(); renderBannerTab(); renderBenefitTab(); renderHomeTab();
        const skipNote = imported.skippedSheets && imported.skippedSheets.length ? ` (인식 못한 시트 ${imported.skippedSheets.length}개는 건너뜀: ${imported.skippedSheets.join(', ')})` : '';
        const bannerSkipNote = imported.skippedBannerBlocks && imported.skippedBannerBlocks.length ? ` (구좌명 헤더가 없는 배너 이력 ${imported.skippedBannerBlocks.length}개는 건너뜀)` : '';
        showToast(`불러오기 완료! 이벤트 ${imported.eventMonths.length}개월 · 배너 ${imported.bannerMonths.length}개월 · 혜택 블록 ${imported.benefitBlocks.length}개 · 자동으로 옮겨온 내용이니 한 번 검수해주세요.${skipNote}${bannerSkipNote}`);
        resetBtn(btn);
      };

      if(STATE.eventMonths.some(m=>m.events.length) || STATE.benefitBlocks.some(b=>b.items.length)){
        showConfirmModal(
          `이벤트 ${imported.eventMonths.length}개월치, 혜택 블록 ${imported.benefitBlocks.length}개를 찾았어요.\n지금까지 입력한 데이터에 이어붙일까요? ("취소"를 누르면 지금 데이터를 지우고 새로 시작해요)`,
          ()=> finishImport(true),
          ()=> finishImport(false)
        );
      }else{
        finishImport(true);
      }
    }catch(err){
      showError('엑셀을 읽는 중 문제가 발생했어요: ' + err.message);
      resetBtn(btn);
    }
  };
  reader.onerror = ()=>{ showError('파일을 읽지 못했어요. 다시 시도해주세요.'); resetBtn(btn); };
  reader.readAsArrayBuffer(file);
}

/* ════════════════════════════════════════════════════════════
   엑셀로 내보내기
   ════════════════════════════════════════════════════════════ */
function handleXlsxExport(btn){
  clearError();
  setBtnLoading(btn, '내보내는 중...');
  setTimeout(()=>{
    try{
      const wb = XLSX.utils.book_new();
      STATE.eventMonths.forEach(mo=>{
        const rows = [ ["우선순위","작업상태","이벤트명","작업유형","구분","반영예정일","반영상태","소스수급","검수용URL","URL유형","운영URL","이벤트ID","특이사항"] ];
        mo.events.forEach(ev=> rows.push([ev.priority,ev.status,ev.name,ev.workType,ev.category,ev.dueDate,ev.reflectStatus,ev.source,ev.reviewUrl,ev.urlType,ev.opUrl,ev.id,ev.note]));
        const ws = XLSX.utils.aoa_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, (mo.label + " 이벤트 관리").slice(0,31));
      });
      if(STATE.bannerMonths.length){
        let rows = [];
        STATE.bannerMonths.forEach(mo=>{
          rows.push([`■ ${mo.label}`]);
          rows.push(["순위", ...mo.columns]);
          mo.ranks.forEach((r,i)=> rows.push([i+1, ...mo.columns.map(c=>r.values[c]||'')]));
          rows.push([]);
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "배너 구좌 이력");
      }
      if(STATE.benefitBlocks.length){
        let rows = [];
        STATE.benefitBlocks.forEach(b=>{
          rows.push([`■ 알닷 혜택 (${b.label})`]);
          rows.push(["혜택명","문구","작업현황"]);
          b.items.forEach(it=> rows.push([it.name,it.copy,it.status]));
          rows.push([]);
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "혜택 이력");
      }
      const exportFilename = "알닷_이벤트_운영_" + new Date().toISOString().slice(0,10) + ".xlsx";
      XLSX.writeFile(wb, exportFilename);
      recordExportSnapshot('엑셀', exportFilename);
      showToast('엑셀 파일로 내보냈어요.');
    }catch(err){
      showError('엑셀로 내보내는 중 문제가 발생했어요: ' + err.message);
    }
    resetBtn(btn);
  }, 50);
}

function handleJsonExport(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = "알닷_운영데이터_백업_" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(url);
  showToast('백업 파일로 저장했어요.');
}
function handleJsonImportFile(file, btn){
  clearError();
  setBtnLoading(btn, '불러오는 중...');
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.eventMonths) throw new Error('올바른 백업 파일이 아니에요.');
      STATE = data;
      ensureStateShape();
      activeEventMonthKey = getDefaultActiveEventMonthKey();
      activeBannerMonthKey = getDefaultActiveBannerMonthKey();
      scheduleSave();
      renderEventsTab(); renderBannerTab(); renderBenefitTab(); renderHomeTab();
      showToast('백업 데이터를 불러왔어요.');
    }catch(err){ showError('백업 파일을 읽는 중 문제가 발생했어요: ' + err.message); }
    resetBtn(btn);
  };
  reader.readAsText(file);
}
